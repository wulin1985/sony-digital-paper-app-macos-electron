<html><body><script>
function xhr(method, url, body) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.timeout = 15000;
    x.open(method, url, true);
    x.onload = () => resolve({ status: x.status, body: x.responseText });
    x.onerror = () => reject(new Error(method + ' ' + url + ' onerror'));
    x.ontimeout = () => reject(new Error(method + ' ' + url + ' timeout'));
    if (body) { x.setRequestHeader('Content-Type', 'application/json'); x.send(JSON.stringify(body)); }
    else x.send();
  });
}
// authctrl 在主进程生成请求信息后，通过 window.__flow 启动
window.__flow = null;
window.__log = function (m) { console.log(m); };
console.log('renderer-ready');
</script></body></html>
